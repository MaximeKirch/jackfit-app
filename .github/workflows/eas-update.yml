name: EAS Update

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish OTA to ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          eas update \
            --branch ${{ github.ref_name == 'main' && 'production' || 'preview' }} \
            --message "$COMMIT_MSG" \
            --non-interactive
